<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 235" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .cor-agenda  { fill:   var(--logo-agenda,  #263647); }
