    <path d="M63 164C65 136 89 118 120 118C151 118 175 136 177 164" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>

    <!-- nome: font-size controla o tamanho (130 = largura de ~620 em Montserrat 500) -->
