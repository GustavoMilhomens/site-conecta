  </g>
    <g id="lombada" class="cor-lombada" stroke-width="3">
    <path d="M27 6V229" stroke-width="3"/>
  </g>
    <g id="pessoa" class="cor-pessoa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
