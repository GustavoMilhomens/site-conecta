    .cor-nome    { fill: var(--logo-nome,   #1c2b3d); font-weight: 500; }
    .cor-slogan  { fill: var(--logo-slogan, #767a7f); font-weight: 500; }
  </style>
  <g id="logo">
    <g id="icone">
