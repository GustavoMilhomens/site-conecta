<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Connecta - Agenda de contatos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Connecta – Agenda de contatos</title>
  <style>
    /* Edite as cores aqui */
    .cor-agenda  { fill:   var(--logo-agenda,  #415f81ff); } /* corpo da agenda */
