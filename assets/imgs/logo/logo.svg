      <rect x="236" y="203" width="26" height="35" rx="8"/>
    </g>
    <rect id="agenda" class="cor-agenda" x="37" y="50" width="199" height="235" rx="15"/>
    <line id="lombada" class="cor-lombada" x1="64" y1="56" x2="64" y2="279" stroke-width="3"/>
    <g id="pessoa" class="cor-pessoa" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="157" cy="137" r="21"/>
